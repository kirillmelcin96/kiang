name: 🐛 Bug report
description: Report a problem or unexpected behavior
title: '[Bug]: '
labels:
  - 'bug'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        > [!IMPORTANT]
        > - Please provide descriptive titles.
        > - Please search existing issues to avoid creating duplicates.
        > - Please provide as much information as possible. It will help us to better understand what's wrong!

  - type: checkboxes
    id: captchas
    attributes:
      label: Preliminary Checks
      description: Please confirm the following before submitting a bug report.
      options:
        - label: I have searched existing issues (https://github.com/kirillmelcin96/kiang/issues) and avoided creating duplicates.
          required: true
        - label: I am not filing a feature request.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and videos
      description: If applicable, add screenshots or videos to help explain your problem.

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
        4. Unexpected behavior...
    validations:
      required: true

  - type: input
    id: kiang-version
    attributes:
      label: kiang version
      placeholder: 'e.g. 1.3.4'
      description: You can check the app version in the `Settings` > `About`. Do NOT click to the Kiang icon!
    validations:
      required: true

  - type: input
    id: ollama-version
    attributes:
      label: Ollama version
      placeholder: 'e.g. 0.32.4'
      description: You can check the version of Ollama by typing 'ollama -v' into the terminal.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: 'e.g. Firefox 155'
      description: Fill in if you opened Kiang as a web page. If you opened it as an app, leave this field blank.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'e.g. Fedora 43'

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add logs or anything else that may help. You can find out where the logs are located in your operating system by reading [the official Tauri documentation](https://v2.tauri.app/plugin/logging/#persisting-logs).
      render: shell
