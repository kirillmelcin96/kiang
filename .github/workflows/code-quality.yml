name: Code quality

on:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    name: Lint | Prettier
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier
        run: pnpm format:check
