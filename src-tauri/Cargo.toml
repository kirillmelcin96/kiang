[package]
name = "kiang"
version = "1.5.0"
description = "A self-hosted web interface for local AI"
authors = ["kirillmelcin96"]
license = "Apache License 2.0"
repository = "https://github.com/kirillmelcin96/kiang"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2.9.2"
tauri-plugin-http = "=2.6.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.12.0"
